version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: tokensaver
    main: ./cmd/tokensaver
    binary: tokensaver
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: tokensaver
    ids: [tokensaver]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^test:"
      - "^chore:"

# A formula, not a cask: Homebrew casks are macOS-only, and this has to install
# on Linux too. GoReleaser deprecated `brews` in favour of `homebrew_casks`, so
# `goreleaser check` reports a deprecation here — accepted deliberately, since a
# cask cannot serve Linux users at all.
brews:
  - name: tokensaver
    ids: [tokensaver]
    directory: Formula
    repository:
      owner: use-tokesaver
      name: homebrew-tokensaver
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: tokensaver release bot
      email: mehranbehnam77@gmail.com
    homepage: https://github.com/use-tokesaver/tokensaver
    description: Local MCP server that turns web pages, PDFs, Office files and JSON into compact, LLM-ready text
    license: MIT
    install: |
      bin.install "tokensaver"
    test: |
      assert_match version.to_s, shell_output("#{bin}/tokensaver -version")
