name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      # The e2e suite builds the real binary and runs it over stdio against a local
      # test site. Chrome tests skip themselves when Chrome is absent, and the live
      # benchmark and the billed A/B harness are both opt-in, so nothing here reaches
      # the network or costs money.
      - run: go test ./...
